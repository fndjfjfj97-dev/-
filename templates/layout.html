<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Канал Бурмалды{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
  <style>
    :root { --orange: #ff6500; --gold: #ff9d00; --ink: #090909; --panel: #151515; --line: #333; --text: #f8f8f8; --muted: #aaa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #462000, transparent 28rem), #080808; color: var(--text); font-family: Montserrat, Arial, sans-serif; }
    a { color: inherit; }
    .nav { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 5vw, 80px); border-bottom: 1px solid #2e2e2e; background: rgba(8,8,8,.86); backdrop-filter: blur(12px); }
    .brand { text-decoration: none; display: flex; align-items: center; gap: 11px; font-weight: 900; letter-spacing: .05em; font-size: .83rem; text-transform: uppercase; }
    .brand-dot { width: 13px; height: 13px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 19px #ff5c00; }
    .nav-links { display: flex; gap: 18px; font-size: .76rem; font-weight: 800; text-transform: uppercase; }
    .nav-links a { color: #bbb; text-decoration: none; } .nav-links a:hover { color: var(--orange); }
    .tag { color: #111; background: var(--orange); padding: 7px 10px; border-radius: 4px; font-size: .67rem; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }
    .button { appearance: none; border: 0; cursor: pointer; border-radius: 5px; background: linear-gradient(100deg, #ff4f00, #ff9900); color: #080808; font: 900 .75rem Montserrat, sans-serif; text-transform: uppercase; letter-spacing: .06em; padding: 15px 20px; box-shadow: 0 8px 27px rgba(255,83,0,.25); text-decoration: none; display: inline-flex; justify-content: center; }
    .button:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .button.secondary { background: #272727; color: #eee; box-shadow: none; border: 1px solid #414141; }
    .notice { padding: 13px 16px; border-radius: 6px; font-size: .83rem; margin-bottom: 20px; } .notice.ok { border: 1px solid #775019; background: #30200c; } .notice.error { border: 1px solid #7a2525; background: #310d0d; }
    @media (max-width: 540px) { .nav { height: 65px; padding: 0 16px; } .nav-links { gap: 12px; font-size: .64rem; } .brand { font-size: .68rem; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>{% block content %}{% endblock %}</body>
</html>
