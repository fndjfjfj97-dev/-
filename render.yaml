services:
  - type: web
    name: burmaldy-live
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: CREATOR_PASSWORD
        sync: false
    disk:
      name: burmaldy-live-data
      mountPath: /var/data
      sizeGB: 1
